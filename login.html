<!DOCTYPE html>
<html>
<head>
    <title>Canteen Management System - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-page">

    <div class="login-wrapper">

        <div class="login-left">
            <div class="logo">🍴</div>
            <h1>Canteen<br>Management System</h1>
            <p>Fresh Food • Fast Service • Happy Students</p>

            <div class="login-info">
                <span>☕ Fresh Meals</span>
                <span>⚡ Quick Service</span>
                <span>💳 Easy Billing</span>
            </div>
        </div>

        <div class="login-box">

            <h2>Welcome Back!</h2>
            <p class="login-subtitle">Login to access the canteen system</p>

            <form action="menu.html">

                <label>Username</label>
                <input type="text" placeholder="Enter your username" required>

                <label>Password</label>
                <input type="password" placeholder="Enter your password" required>

                <div class="remember">
                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="main-btn">LOGIN</button>

            </form>

            <p class="login-footer">
                University Canteen System
            </p>

        </div>

    </div>

</body>
</html>
